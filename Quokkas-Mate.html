<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EQC Web Dev Mate (25g)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #111; color: #f3f3f3; margin: 0; }
  header { background: #2b1c0f; color: #f9e4c6; padding: 12px 16px; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 16px; }
  .chat { border: 1px solid #3a2a18; border-radius: 10px; padding: 12px; background: #1a120a; min-height: 60vh; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 75%; white-space: pre-wrap; word-wrap: break-word; }
  .u { background: #f0a34a; color: #1a120a; align-self: flex-end; border-top-right-radius: 4px; }
  .a { background: #3a2a18; color: #f9e4c6; align-self: flex-start; border-top-left-radius: 4px; }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
  input, button { font: inherit; }
  input[type=text] { padding: 10px; border-radius: 8px; border: 1px solid #3a2a18; background: #14110b; color: #f3f3f3; }
  button { padding: 10px 14px; border-radius: 8px; border: 1px solid #3a2a18; background: #f0a34a; color: #1a120a; cursor: pointer; }
</style>
</head>
<body>
<header><strong>EQC Web Dev Mate (25g)</strong> — Learning Assistant</header>
<div class="wrap">
  <div id="chat" class="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question…" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script>
// === CONFIG ===
const LOGGER_URL = "https://script.google.com/macros/s/AKfycbx_C0KmAw2JA6JhF0qhIEYRz1PQluODLD8efQM0v4XmE82bS9OAR-AwYItS3Xoyd-ZI/exec";
const sessionId = crypto.randomUUID();

// === BASIC CHAT ===
const chatEl = document.getElementById("chat");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");

function addMsg(text, who) {
  const row = document.createElement("div");
  row.className = "row";
  const msg = document.createElement("div");
  msg.className = "msg " + who;
  msg.textContent = text;
  row.appendChild(msg);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = inputEl.value.trim();
  if (!q) return;
  addMsg(q, "u");
  inputEl.value = "";

  // Simulate response from EQC Web Dev Mate (placeholder for now)
  const reply = "Thanks for your question! (This is where EQC Web Dev Mate’s reply will appear.)";

  addMsg(reply, "a");

  // === LOG TO GOOGLE SHEETS ===
  try {
    await fetch(LOGGER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        student_id: "auto-logged",
        topic: "general",
        question: q,
        response_summary: reply.slice(0, 300),
        resources_links: [],
        session_id: sessionId
      }),
      mode: "no-cors"
    });
  } catch (err) {
    console.error("Logging error:", err);
  }
});

addMsg("Hi there! I’m your EQC Web Dev Mate (25g). Ask me about anything in your backend web dev course.", "a");
</script>
</body>
</html>
